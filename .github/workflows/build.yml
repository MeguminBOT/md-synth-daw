# Builds MD Synth DAW on every platform it targets, and keeps the results as artifacts.
# Run by hand from the Actions tab. Releases live in release.yml.

name: Build

on:
  workflow_dispatch:
    inputs:
      gate:
        description: "Run the gate after building"
        type: boolean
        default: true
      debug:
        description: "Build with debug information"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # haxe says where Haxe comes from. The action publishes x86-64 builds
          # only, so anything arm64 takes it from a package manager instead.
          - name: Windows x86-64
            runs-on: windows-latest
            haxe: action
            artifact: mdd-windows-x86_64

          - name: Linux x86-64
            runs-on: ubuntu-latest
            container: debian:trixie
            haxe: apt
            wrap: xvfb-run -a
            artifact: mdd-linux-x86_64

          - name: Linux arm64
            runs-on: ubuntu-24.04-arm
            container: debian:trixie
            haxe: apt
            wrap: xvfb-run -a
            artifact: mdd-linux-arm64

          # macOS 26 is the last release for Intel, and Homebrew builds its
          # bottles for the runner's own macOS, so this is as far back as a
          # package built here can reach.
          - name: macOS x86-64
            runs-on: macos-26-intel
            haxe: brew
            artifact: mdd-macos-x86_64

          - name: macOS arm64
            runs-on: macos-latest
            haxe: brew
            artifact: mdd-macos-arm64

    defaults:
      run:
        shell: bash

    steps:
      # The Debian container is bare, and even checkout needs git in it.
      # Debian carries Haxe and SDL3 for both architectures, which is why the
      # Linux jobs run in a container rather than on the runner image.
      - name: Prepare the container
        if: matrix.haxe == 'apt'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git unzip xz-utils \
            clang lld llvm g++ make \
            libsdl3-dev haxe neko xvfb xauth

      - uses: actions/checkout@v7.0.1

      - name: Install Haxe and SDL3
        if: matrix.haxe == 'brew'
        run: brew install haxe sdl3

      # If macOS breaks again, this is what the next round needs to know, so the
      # log answers it rather than costing another run to find out.
      - name: Say where SDL3 landed
        if: matrix.haxe == 'brew'
        run: |
          echo "brew prefix: $(brew --prefix)"
          echo "sdl3 prefix: $(brew --prefix sdl3 2>&1)"
          echo "header:"
          ls -l "$(brew --prefix)/include/SDL3/SDL.h" 2>&1 || true
          ls -l "$(brew --prefix sdl3)/include/SDL3/SDL.h" 2>&1 || true
          echo "library:"
          ls -l "$(brew --prefix)/lib/libSDL3"* 2>&1 || true
          echo "sdk: $(xcrun --show-sdk-path 2>&1), version $(xcrun --show-sdk-version 2>&1)"

      # hxcpp aims at macOS 10.9 unless something else says otherwise, and clang
      # raises that to 11.0 on arm64 because nothing older runs there. Homebrew's
      # SDL3 is built for the runner's own macOS, so the binary shipped a minimum
      # it could not honour: 0.3.0 says macOS 11.0 and carries an SDL3 built for
      # 26.0, which will not load on anything older. hxcpp reads every
      # environment variable as a define, so this is what it aims at instead.
      - name: Aim at the macOS the libraries were built for
        if: matrix.haxe == 'brew'
        run: |
          major="$(sw_vers -productVersion | cut -d. -f1)"
          echo "MACOSX_DEPLOYMENT_TARGET=${major}.0" >> "$GITHUB_ENV"
          echo "aiming at macOS ${major}.0"

      - uses: krdlab/setup-haxe@v2.1.1
        if: matrix.haxe == 'action'
        with:
          haxe-version: 4.3.7

      # The action arranges this itself; a package manager does not.
      - name: Point haxelib somewhere
        if: matrix.haxe != 'action'
        run: haxelib setup ~/haxelib

      - name: Say what is installed
        run: |
          haxe --version
          haxelib version

      # Get latest hxcpp from its newest tag.
      # A checkout carries run.n, which only launches the build tool hxcpp.n, and
      # hxcpp.n is compiled from tools/hxcpp rather than committed. Without it
      # hxcpp stops to ask on the terminal whether to build it, and a runner has
      # nobody to answer, so the build fails after thirty seconds of waiting.
      - name: Install hxcpp from its newest tag
        run: |
          url=https://github.com/HaxeFoundation/hxcpp.git
          tag=$(git ls-remote --tags --refs --sort=-v:refname "$url" | sed -n 1p)
          tag=${tag##*refs/tags/}

          test -n "$tag"
          echo "hxcpp $tag"

          haxelib --always git hxcpp "$url" "$tag"

          root=$(haxelib path hxcpp | sed -n 1p)
          (cd "$root/tools/hxcpp" && haxe compile.hxml)

          test -f "$root/hxcpp.n"
          echo "hxcpp.n built in $root"

      # --nuked fetches the reference FM core. It is never linked into anything
      # and never shipped, but without it mdd gate chip does not run at all, and
      # that check is the one the accuracy claim rests on.
      - name: Fetch the vendored sources
        run: ./mdd setup --nuked

      - name: Report what is present
        run: ./mdd check

      - name: Build
        run: ./mdd build ${{ inputs.debug && '-debug' || '' }}

      - name: Build the gate
        if: inputs.gate
        run: ./mdd build gate ${{ inputs.debug && '-debug' || '' }}

      # Seven gate programs open a real window, and a Linux runner has no display,
      # so SDL finds no video device and the gate fails rather than being skipped.
      - name: Run the gate
        if: inputs.gate
        run: ${{ matrix.wrap }} ./mdd gate

      - name: Package
        run: ./mdd package portable

      # The staged folder rather than the archive of it. GitHub zips an artifact
      # whatever it is given, so uploading a tar.gz here would mean unpacking a
      # zip, then a tar.gz, then a tar, then a folder to reach one binary.
      - name: Keep the portable build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}-portable
          path: export/package/*-portable/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
