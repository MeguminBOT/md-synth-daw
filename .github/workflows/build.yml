# Builds MD Synth DAW on every platform it targets, and keeps the results as artifacts.
# Run by hand from the Actions tab. Releases live in release.yml.

name: Build

on:
  workflow_dispatch:
    inputs:
      gate:
        description: "Run the gate after building"
        type: boolean
        default: true
      debug:
        description: "Build with debug information"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86-64
            runs-on: windows-latest
            shell: bash
            artifact: mdd-windows-x86_64

          - name: Linux x86-64
            runs-on: ubuntu-latest
            container: debian:trixie
            shell: bash
            artifact: mdd-linux-x86_64

          - name: Linux arm64
            runs-on: ubuntu-24.04-arm
            container: debian:trixie
            shell: bash
            artifact: mdd-linux-arm64

          - name: macOS x86-64
            runs-on: macos-15-intel
            shell: bash
            artifact: mdd-macos-x86_64

          - name: macOS arm64
            runs-on: macos-latest
            shell: bash
            artifact: mdd-macos-arm64

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      # The Debian container is bare, and even checkout needs git in it.
      - name: Prepare the container
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git unzip xz-utils \
            clang lld llvm g++ make libsdl3-dev

      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Install hxcpp
        run: haxelib install hxcpp --quiet --always

      # SDL3 is a system package off Windows. On Windows mdd setup fetches it.
      - name: Install SDL3
        if: startsWith(matrix.name, 'macOS')
        run: brew install sdl3

      - name: Fetch the vendored sources
        run: ./mdd setup

      - name: Report what is present
        run: ./mdd check

      - name: Build
        run: ./mdd build ${{ inputs.debug && '-debug' || '' }}

      - name: Build the gate
        if: inputs.gate
        run: ./mdd build gate ${{ inputs.debug && '-debug' || '' }}

      - name: Run the gate
        if: inputs.gate
        run: ./mdd gate

      - name: Package
        run: ./mdd package portable

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: export/package/
          if-no-files-found: error
          retention-days: 14
