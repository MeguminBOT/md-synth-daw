# Builds MD Synth DAW on every platform it targets, and keeps the results as artifacts.
# Run by hand from the Actions tab. Releases live in release.yml.

name: Build

on:
  workflow_dispatch:
    inputs:
      gate:
        description: "Run the gate after building"
        type: boolean
        default: true
      debug:
        description: "Build with debug information"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # haxe says where Haxe comes from. The action publishes x86-64 builds
          # only, so anything arm64 takes it from a package manager instead.
          - name: Windows x86-64
            runs-on: windows-latest
            haxe: action
            artifact: mdd-windows-x86_64

          - name: Linux x86-64
            runs-on: ubuntu-latest
            container: debian:trixie
            haxe: apt
            wrap: xvfb-run -a
            artifact: mdd-linux-x86_64

          - name: Linux arm64
            runs-on: ubuntu-24.04-arm
            container: debian:trixie
            haxe: apt
            wrap: xvfb-run -a
            artifact: mdd-linux-arm64

          - name: macOS x86-64
            runs-on: macos-15-intel
            haxe: brew
            artifact: mdd-macos-x86_64

          - name: macOS arm64
            runs-on: macos-latest
            haxe: brew
            artifact: mdd-macos-arm64

    defaults:
      run:
        shell: bash

    steps:
      # The Debian container is bare, and even checkout needs git in it.
      # Debian carries Haxe and SDL3 for both architectures, which is why the
      # Linux jobs run in a container rather than on the runner image.
      - name: Prepare the container
        if: matrix.haxe == 'apt'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git unzip xz-utils \
            clang lld llvm g++ make \
            libsdl3-dev haxe neko xvfb xauth

      - uses: actions/checkout@v7.0.1

      - name: Install Haxe and SDL3
        if: matrix.haxe == 'brew'
        run: brew install haxe sdl3

      # If macOS breaks again, this is what the next round needs to know, so the
      # log answers it rather than costing another run to find out.
      - name: Say where SDL3 landed
        if: matrix.haxe == 'brew'
        run: |
          echo "brew prefix: $(brew --prefix)"
          echo "sdl3 prefix: $(brew --prefix sdl3 2>&1)"
          echo "header:"
          ls -l "$(brew --prefix)/include/SDL3/SDL.h" 2>&1 || true
          ls -l "$(brew --prefix sdl3)/include/SDL3/SDL.h" 2>&1 || true
          echo "library:"
          ls -l "$(brew --prefix)/lib/libSDL3"* 2>&1 || true
          echo "sdk: $(xcrun --show-sdk-path 2>&1), version $(xcrun --show-sdk-version 2>&1)"

      - uses: krdlab/setup-haxe@v2.1.1
        if: matrix.haxe == 'action'
        with:
          haxe-version: 4.3.7

      # The action arranges this itself; a package manager does not.
      - name: Point haxelib somewhere
        if: matrix.haxe != 'action'
        run: haxelib setup ~/haxelib

      - name: Say what is installed
        run: |
          haxe --version
          haxelib version

      - name: Install hxcpp
        run: haxelib install hxcpp --quiet --always

      # hxcpp bundles zlib 1.2.11 and builds it from source on macOS, where there
      # is no prebuilt runtime for arm64. That zlib poisons fdopen whenever
      # TARGET_OS_MAC is defined, which every current Apple SDK does, and the
      # poisoned macro then breaks the declaration in <stdio.h>. Upstream fixed
      # it in 1.2.12; drop this step once hxcpp ships a zlib that new.
      - name: Unpoison the zlib hxcpp bundles
        if: matrix.haxe == 'brew'
        run: |
          zutil="$(haxelib path hxcpp | head -1)/project/thirdparty/zlib-1.2.11/zutil.h"
          test -f "$zutil"
          sed -i '' 's/#if defined(MACOS) || defined(TARGET_OS_MAC)/#if defined(MACOS)/' "$zutil"
          grep -n 'defined(MACOS)' "$zutil"

      # --nuked fetches the reference FM core. It is never linked into anything
      # and never shipped, but without it mdd gate chip does not run at all, and
      # that check is the one the accuracy claim rests on.
      - name: Fetch the vendored sources
        run: ./mdd setup --nuked

      - name: Report what is present
        run: ./mdd check

      - name: Build
        run: ./mdd build ${{ inputs.debug && '-debug' || '' }}

      - name: Build the gate
        if: inputs.gate
        run: ./mdd build gate ${{ inputs.debug && '-debug' || '' }}

      # Seven gate programs open a real window, and a Linux runner has no display,
      # so SDL finds no video device and the gate fails rather than being skipped.
      - name: Run the gate
        if: inputs.gate
        run: ${{ matrix.wrap }} ./mdd gate

      - name: Package
        run: ./mdd package portable

      # The staged folder rather than the archive of it. GitHub zips an artifact
      # whatever it is given, so uploading a tar.gz here would mean unpacking a
      # zip, then a tar.gz, then a tar, then a folder to reach one binary.
      - name: Keep the portable build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}-portable
          path: export/package/*-portable/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
