# Builds every platform and publishes a GitHub release from the results.
# Only the repository owner can run it. Ordinary test builds live in build.yml.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v0.1.0"
        type: string
        required: true
      dry_run:
        description: "Rehearse only: build, gate and sign, but publish nothing"
        type: boolean
        default: false
      draft:
        description: "Publish as a draft"
        type: boolean
        default: true
      prerelease:
        description: "Mark as a prerelease"
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write      # create the release
  id-token: write      # the OIDC token Sigstore signs against
  attestations: write  # store the build provenance

jobs:
  # Nothing else runs until this passes, so a stranger with write access
  # cannot cut a release even if they can reach the Actions tab.
  owner:
    name: Check who asked
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anybody but the owner
        run: |
          if [ "${{ github.actor }}" != "${{ github.repository_owner }}" ]; then
            echo "${{ github.actor }} is not ${{ github.repository_owner }}."
            echo "Only the repository owner publishes releases."
            exit 1
          fi
          echo "Running as ${{ github.repository_owner }}."

      - uses: actions/checkout@v7.0.1

      # Every built file carries the version out of mdd.xml, so a tag that says
      # something else puts v0.2.0 on a release full of 0.1.0 files. Cheaper to
      # find here than after five platforms have built.
      - name: Refuse a tag that is not the version being built
        run: |
          asked="${{ inputs.tag }}"
          asked="${asked#v}"
          built="$(grep '<meta ' mdd.xml | grep -o 'version="[^"]*"' | head -1 | cut -d'"' -f2)"

          if [ "$asked" != "$built" ]; then
            echo "The tag asks for $asked and mdd.xml carries $built."
            echo "Edit the version in mdd.xml, or pass the tag that matches it."
            exit 1
          fi
          echo "Publishing $built."

  notes:
    name: Write the release notes
    needs: owner
    runs-on: ubuntu-latest
    steps:
      # The whole history, because the notes are the commit log since the
      # previous tag.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: krdlab/setup-haxe@v2.1.0
        with:
          haxe-version: 4.3.7

      - name: Write them
        shell: bash
        run: |
          ./mdd notes "${{ inputs.tag }}"
          cat export/NOTES.md

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-notes
          path: export/NOTES.md
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    needs: owner
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # haxe says where Haxe comes from. The action publishes x86-64 builds
          # only, so anything arm64 takes it from a package manager instead.
          - name: Windows x86-64
            runs-on: windows-latest
            haxe: action
            artifact: mdd-windows-x86_64

          - name: Linux x86-64
            runs-on: ubuntu-latest
            container: debian:trixie
            haxe: apt
            artifact: mdd-linux-x86_64

          - name: Linux arm64
            runs-on: ubuntu-24.04-arm
            container: debian:trixie
            haxe: apt
            artifact: mdd-linux-arm64

          - name: macOS x86-64
            runs-on: macos-15-intel
            haxe: brew
            artifact: mdd-macos-x86_64

          - name: macOS arm64
            runs-on: macos-latest
            haxe: brew
            artifact: mdd-macos-arm64

    defaults:
      run:
        shell: bash

    steps:
      # Debian carries Haxe and SDL3 for both architectures, which is why the
      # Linux jobs run in a container rather than on the runner image.
      - name: Prepare the container
        if: matrix.haxe == 'apt'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git unzip xz-utils \
            clang lld llvm g++ make \
            libsdl3-dev haxe neko

      - uses: actions/checkout@v7.0.1

      - name: Install Haxe and SDL3
        if: matrix.haxe == 'brew'
        run: brew install haxe sdl3

      # If macOS breaks again, this is what the next round needs to know, so the
      # log answers it rather than costing another run to find out.
      - name: Say where SDL3 landed
        if: matrix.haxe == 'brew'
        run: |
          echo "brew prefix: $(brew --prefix)"
          echo "sdl3 prefix: $(brew --prefix sdl3 2>&1)"
          echo "header:"
          ls -l "$(brew --prefix)/include/SDL3/SDL.h" 2>&1 || true
          ls -l "$(brew --prefix sdl3)/include/SDL3/SDL.h" 2>&1 || true
          echo "library:"
          ls -l "$(brew --prefix)/lib/libSDL3"* 2>&1 || true
          echo "sdk: $(xcrun --show-sdk-path 2>&1), version $(xcrun --show-sdk-version 2>&1)"

      - uses: krdlab/setup-haxe@v2.1.0
        if: matrix.haxe == 'action'
        with:
          haxe-version: 4.3.7

      # The action arranges this itself; a package manager does not.
      - name: Point haxelib somewhere
        if: matrix.haxe != 'action'
        run: haxelib setup ~/haxelib

      - name: Say what is installed
        run: |
          haxe --version
          haxelib version

      - name: Install hxcpp
        run: haxelib install hxcpp --quiet --always

      # hxcpp bundles zlib 1.2.11 and builds it from source on macOS, where there
      # is no prebuilt runtime for arm64. That zlib poisons fdopen whenever
      # TARGET_OS_MAC is defined, which every current Apple SDK does, and the
      # poisoned macro then breaks the declaration in <stdio.h>. Upstream fixed
      # it in 1.2.12; drop this step once hxcpp ships a zlib that new.
      - name: Unpoison the zlib hxcpp bundles
        if: matrix.haxe == 'brew'
        run: |
          zutil="$(haxelib path hxcpp | head -1)/project/thirdparty/zlib-1.2.11/zutil.h"
          test -f "$zutil"
          sed -i '' 's/#if defined(MACOS) || defined(TARGET_OS_MAC)/#if defined(MACOS)/' "$zutil"
          grep -n 'defined(MACOS)' "$zutil"

      - name: Fetch the vendored sources
        run: ./mdd setup

      - name: Build
        run: ./mdd build

      # mdd package writes the Inno script either way and only says so when ISCC
      # is missing, so without this a Windows release would quietly go out with
      # the portable archive and no installer.
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Package
        run: ./mdd package

      - name: Check the installer was actually built
        if: runner.os == 'Windows'
        run: test -f export/package/*setup.exe

      # Kept apart: a portable copy and an installed one behave differently, and
      # nobody downloading one wants the other inside the same archive.
      - name: Keep the portable archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}-portable
          path: |
            export/package/*-portable.zip
            export/package/*-portable.tar.gz
          if-no-files-found: error

      - name: Keep the installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}-installer
          path: |
            export/package/*-setup.exe
            export/package/*-installer.tar.gz
            export/package/*.dmg
          if-no-files-found: error

  publish:
    name: Publish ${{ inputs.tag }}
    needs: [build, notes]
    runs-on: ubuntu-latest
    steps:
      - name: Collect every platform
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: mdd-*
          path: packages
          merge-multiple: true

      # Kept out of packages: the notes are the release body, not a download.
      - name: Collect the release notes
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-notes
          path: notes

      - name: Say what is going out
        run: ls -la packages

      - name: Write the checksums
        working-directory: packages
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Provenance says which workflow, at which commit, produced these files.
      # Verify with: gh attestation verify <file> --repo ${{ github.repository }}
      #
      # GitHub refuses to store an attestation for a user-owned private
      # repository and fails the step rather than skipping it, which took the
      # whole release down with it. It comes back on its own once public.
      - name: Attest the build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            packages/*.zip
            packages/*.tar.gz
            packages/*.dmg
            packages/*setup.exe

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless Sigstore signatures, one bundle per file, so a download can be
      # checked with cosign alone and without the GitHub CLI.
      - name: Sign every file
        working-directory: packages
        run: |
          for file in *; do
            case "$file" in
              *.sigstore) continue ;;
            esac
            echo "signing $file"
            cosign sign-blob --yes --bundle "$file.sigstore" "$file"
          done
          ls -la

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: MD Synth DAW ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          body_path: notes/NOTES.md
          fail_on_unmatched_files: true
          files: packages/*

      # A dry run has done everything a real one does except create the release
      # and its tag, so the files are kept where they can be looked at instead.
      - name: Keep the signed files instead
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dry-run-${{ inputs.tag }}
          path: packages/
          if-no-files-found: error
          retention-days: 7

      - name: Say what a real run would have published
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Dry run for ${{ inputs.tag }}"
            echo ""
            echo "No release and no tag were created. Every file below was built,"
            echo "passed the gate, and was signed exactly as a real run signs them."
            echo ""
            echo '```'
            ls -1 packages
            echo '```'
            echo ""
            echo "### The release body it would have carried"
            echo ""
            cat notes/NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"
